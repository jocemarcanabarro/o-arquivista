<style>
/* --- RESET GERAL MOBILE --- */
@media (max-width: 899px) {
    .header { padding: 10px 0 !important; }

    /* Grade de Fotos 2 Colunas Limpa */
    .main, .list {
        grid-template-columns: repeat(2, 1fr) !important;

        padding: 10px !important;
    }
    
    /* Novo container de botões */
    .menu-novo-jotta {
        display: flex !important;
        width: 98% !important;
        margin: 10px auto !important;
        gap: 5px !important;
        justify-content: center !important;
    }
    
    .btn-jotta {
        flex: 1 !important;
        background: #00ff00 !important; /* VERDE PARA TESTE */
        color: #000 !important;
        padding: 12px 2px !important;
        border-radius: 8px !important;
        text-align: center !important;
        font-weight: bold !important;
        font-size: 0.8rem !important;
        text-decoration: none !important;
    }
}

/* --- MANTER PC INTACTO --- */
@media (min-width: 900px) {
    .header { position: fixed !important; left: 0; top: 0; width: 250px !important; height: 100vh !important; background: #1d1e20 !important; padding: 40px 20px !important; z-index: 1000; }
    .main { margin-left: 270px !important; }
    .menu-novo-jotta { display: block !important; margin-top: 30px; }
    .btn-jotta {

        background: #2a2b2d !important; 
        color: #fff !important; 
        padding: 12px !important; 
        margin-bottom: 10px !important;
        border-radius: 6px !important;
        text-decoration: none !important;
    }
}

/* FIX IMAGENS E TÍTULOS */
.entry-cover img { width: 100% !important; aspect-ratio: 1/1 !important; object-fit: cover !important; border-radius: 10px !important; }
.entry-header { margin-top: 8px !important; text-align: center !important; }
.entry-content, .post-meta, .entry-footer, .first-entry { display: none !important; }
</style>

<div id="container-fix" class="menu-novo-jotta" style="display: none;">

<script>
document.addEventListener("DOMContentLoaded", function() {
    var menu = document.getElementById('container-fix');

        menu.style.display = (window.innerWidth > 900) ? 'block' : 'flex';
        header.appendChild(menu);

});

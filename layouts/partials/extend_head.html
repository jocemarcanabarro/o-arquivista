<style>
/* --- GRADE DE VITRINE --- */
.main, .list {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important;
    gap: 15px !important;
    max-width: 1200px !important;
    margin: auto !important;
    padding: 10px !important;
}

/* --- FIX DAS IMAGENS (PARA APARECER NAS CATEGORIAS) --- */
.entry-cover, .entry-cover img, .post-entry img {
    display: block !important;
    width: 100% !important;
    aspect-ratio: 1 / 1 !important;
    object-fit: cover !important;
    border-radius: 10px !important;
    background: #2a2b2d !important;
}

/* --- BARRA LATERAL (APENAS PC) --- */
@media (min-width: 900px) {
    .header {
        position: fixed !important;
        left: 0; top: 0;
        width: 250px !important;
        height: 100vh !important;
        background: #1d1e20 !important;
        border-right: 1px solid #333 !important;
        padding: 40px 20px !important;
        z-index: 1000;
    }
    .main { margin-left: 270px !important; }
    #nav-container { margin-top: 30px; display: block !important; }
}

/* --- BARRA NO TOPO (CELULAR) --- */
@media (max-width: 899px) {
    .header { 
        position: relative !important; 
        width: 100% !important; 
        padding: 15px 10px !important; 
    }
    .main { margin-left: 0 !important; grid-template-columns: repeat(2, 1fr) !important; }
    
    #nav-container {
        display: flex !important;
        justify-content: center !important;
        gap: 8px !important;
        padding: 10px 0 !important;
        width: 100% !important;
    }
    #nav-container h3 { display: none; } /* Esconde o título no celular */
}

/* --- ESTILO DOS BOTÕES --- */
.btn-nav {
    display: block;
    padding: 10px;
    background: #2a2b2d;
    border-radius: 6px;
    color: #fff !important;
    text-decoration: none;
    font-size: 0.85rem;
    margin-bottom: 8px;
    text-align: center;
    border: 1px solid #444;
}
.btn-nav:hover { background: #00ff00; color: #000 !important; }

/* LIMPEZA GERAL */
.entry-content, .post-meta, .entry-footer, .first-entry { display: none !important; }
.entry-header h2 { font-size: 0.9rem !important; text-align: center; padding: 5px; }
.post-entry { border: none !important; background: transparent !important; }

/* LINK DO TELEGRAM NA BASE */
.telegram-footer {
    grid-column: 1 / -1;
    text-align: center;
    padding: 20px;
    margin-top: 20px;
}
</style>

<div id="nav-container" style="display: none;">
    <h3 style="color: #00ff00; font-size: 0.9rem; margin-bottom: 15px; font-weight: bold;">📂 CATEGORIAS</h3>

    <a href="/" class="btn-nav">🏠 Tudo</a>
</div>

<div class="telegram-footer">
    <a href="https://t.me/O_Arquivista" target="_blank" style="color: #0088cc; text-decoration: none; font-weight: bold;">➡️ Entre no Grupo Gratuito do Telegram</a>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const nav = document.getElementById('nav-container');
    const header = document.querySelector('.header');
    if (nav && header) {
        nav.style.display = (window.innerWidth > 900) ? 'block' : 'flex';
        header.appendChild(nav);
    }
});
</script>

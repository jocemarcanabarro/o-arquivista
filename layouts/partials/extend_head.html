<style>
/* --- MENU LATERAL FIXO (PC) --- */
@media (min-width: 900px) {
    body {
        display: flex;
        flex-direction: row;
    }
    .header {
        position: fixed !important;
        left: 0;
        top: 0;
        width: 260px !important;
        height: 100vh !important;
        background: #1d1e20 !important;
        border-right: 1px solid #333 !important;
        padding: 40px 20px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        z-index: 1000;
    }
    .main { 
        margin-left: 280px !important; 
        max-width: calc(100% - 300px) !important;
    }
    
    /* Injetando o título e links via CSS para garantir que apareçam */
    .header::after {
        content: "📂 NAVEGAÇÃO";
        color: #00ff00;
        font-weight: bold;
        font-size: 0.9rem;
        margin-top: 30px;
        display: block;
    }
}

/* --- LINKS DAS CATEGORIAS (ESTILO BOTÃO) --- */
.nav-menu-custom {
    margin-top: 20px;
    width: 100%;
}
.nav-menu-custom a {
    display: block;
    padding: 12px;
    margin-bottom: 8px;
    background: #2a2b2d;
    border-radius: 6px;
    color: #fff;
    text-decoration: none;
    font-size: 0.85rem;
    transition: 0.3s;
}
.nav-menu-custom a:hover { background: #3e3f42; }

/* --- GRADE DE FOTOS --- */
.main, .list {
    display: grid !important;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important;
    gap: 20px !important;
}

/* --- AJUSTE CELULAR --- */
@media (max-width: 899px) {
    .header { width: 100% !important; height: auto !important; position: relative !important; border: none !important; }
    .main { margin-left: 0 !important; grid-template-columns: repeat(2, 1fr) !important; }
    #desktop-menu { display: none; } /* Esconde menu lateral no celular */
}

/* Limpeza de textos desnecessários */
.entry-content, .post-meta, .entry-footer { display: none !important; }
.entry-cover img { aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; }
</style>

<div id="desktop-menu" class="nav-menu-custom" style="display: none;">
    <script>
        // Este script apenas move o menu para dentro da sidebar no PC
        document.addEventListener("DOMContentLoaded", function() {
            if (window.innerWidth > 900) {
                const menu = document.getElementById('desktop-menu');
                const header = document.querySelector('.header');
                menu.style.display = 'block';
                header.appendChild(menu);
            }
        });
    </script>
    <a href="/categories/impressao-3d/">📦 Impressão 3D</a>
    <a href="/categories/corte-laser/">🔥 Corte Laser</a>
    <a href="/">🏠 Ver Tudo</a>
</div>

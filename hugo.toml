baseURL = 'https://www.oarquivista.com/'
languageCode = 'pt-br'
title = 'O Arquivista VIP'
theme = 'PaperMod'

[params]
    env = 'production'
    title = 'O Arquivista VIP'
    description = 'Catálogo multidisciplinar: Laser, 3D, Papercraft e Sublimação.'
    defaultTheme = 'dark'
    
    # --- CONFIGURAÇÃO DE CATÁLOGO ---
    showFullTextContent = false
    displayFullPostContent = false
    hideMeta = true          # Esconde data e autor (essencial para catálogo)
    showShareButtons = false # Deixa a vitrine mais limpa
    showCodeCopyButtons = false

    # --- LOGO ---
    [params.label]
        text = "O Arquivista"
        icon = "images/logo.png"
        iconHeight = 35

    # --- ABA DO NAVEGADOR ---
    [params.assets]
        favicon = "images/logo.png"

[markup.goldmark.renderer]
    unsafe = true # Permite links do Telegram nos posts

[[menu.main]]
    name = 'Grupo Gratuito (Telegram)'
    url = 'https://t.me/O_Arquivista'
    weight = 10

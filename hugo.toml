baseURL = 'https://www.oarquivista.com/'
languageCode = 'pt-br'
title = 'O Arquivista VIP'
theme = 'PaperMod'
enableRobotsTXT = true

[taxonomies]
  category = 'categories'

[params]
    env = 'production'
    title = 'O Arquivista VIP'
    description = 'Arquivos para Laser e 3D.'
    defaultTheme = 'dark'
    googleSiteVerification = "vyI8M7XR3GAMr7s54yCn4jO5zF6RbYEfLWn6JVwKOA0"
    
    # Isso força a Home a mostrar os posts
    mainSections = ["posts"]
    showFullTextContent = false
    displayFullPostContent = false
    hideMeta = true

    [params.assets]
        favicon = "images/logo.png"

[markup.goldmark.renderer]
    unsafe = true

baseURL = 'https://www.oarquivista.com/'
languageCode = 'pt-br'
title = 'O Arquivista VIP'
theme = 'PaperMod'
enableRobotsTXT = true

[params]
    env = 'production'
    title = 'O Arquivista VIP'
    description = 'Catálogo multidisciplinar de arquivos para Laser, 3D e Sublimação.'
    defaultTheme = 'dark'
    googleSiteVerification = "vyI8M7XR3GAMr7s54yCn4jO5zF6RbYEfLWn6JVwKOA0"
    
    # --- CONFIGURAÇÃO DE GRADE ---
    showFullTextContent = false
    displayFullPostContent = false
    hideMeta = true
    
    # Isso força o PaperMod a usar o layout de lista compacta
    [params.homeInfoParams]
        Title = "Catálogo O Arquivista"
        Content = "Os melhores vetores para sua produção."

    [params.assets]
        favicon = "images/logo.png"
        # Forçamos o caminho relativo correto do CSS
        customCSS = ["css/extended.css"]

[markup.goldmark.renderer]
    unsafe = true

[[menu.main]]
    name = 'Grupo Gratuito'
    url = 'https://t.me/O_Arquivista'
    weight = 10

baseURL = 'https://www.oarquivista.com/'
languageCode = 'pt-br'
title = 'O Arquivista VIP'
theme = 'PaperMod'

[taxonomies]
  category = 'categories'

[params]
    env = 'production'
    title = 'O Arquivista VIP'
    description = 'Catálogo de arquivos para Laser e 3D'
    defaultTheme = 'dark'
    
    # Faz os posts aparecerem na Home
    mainSections = ["posts"]
    
    # Configurações para as imagens WebP aparecerem
    [params.cover]
        linkFullImages = true
        responsiveImages = false
        hidden = false
        hiddenInList = false
        hiddenInSingle = false

    [params.assets]
        favicon = "images/logo.png"

[markup.goldmark.renderer]
    unsafe = true

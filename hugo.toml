baseURL = 'https://www.oarquivista.com/'
languageCode = 'pt-br'
title = 'O Arquivista VIP'
theme = 'PaperMod'
enableRobotsTXT = true

[taxonomies]
  category = 'categories'

[params]
    env = 'production'
    title = 'O Arquivista VIP'
    description = 'O maior catálogo multidisciplinar de vetores e arquivos digitais.'
    defaultTheme = 'dark'
    googleSiteVerification = "vyI8M7XR3GAMr7s54yCn4jO5zF6RbYEfLWn6JVwKOA0"
    
    # Exibir posts na Home (Últimos arquivos postados)
    listSections = ["posts"]
    showFullTextContent = false
    displayFullPostContent = false
    hideMeta = true

    [params.label]
        text = "O Arquivista"
        icon = "images/logo.png"
        iconHeight = 35

    [params.assets]
        favicon = "images/logo.png"

[markup.goldmark.renderer]
    unsafe = true

[[menu.main]]
    name = 'Grupo Gratuito'
    url = 'https://t.me/O_Arquivista'
    weight = 10

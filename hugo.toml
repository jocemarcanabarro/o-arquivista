baseURL = 'https://www.oarquivista.com/'
languageCode = 'pt-br'
title = 'O Arquivista VIP'
theme = 'PaperMod'

[taxonomies]
  category = 'categories'

[params]
    env = 'production'
    defaultTheme = 'dark'
    mainSections = ["posts"] # Crucial para aparecer na Home
    
    [params.cover]
        linkFullImages = true
        responsiveImages = false # Desativar para evitar que o Hugo "suma" com elas

    [params.assets]
        favicon = "images/logo.png"

[markup.goldmark.renderer]
    unsafe = true
